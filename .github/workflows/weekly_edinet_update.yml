name: Weekly EDINET Financial Update

# EDINETの財務データは決算期にしか変わらないため、毎日ではなく週次で実行する。
# 初回実行時は過去450日分を走査するため、通常より時間がかかる。
on:
  schedule:
    # UTC 17:00 日曜 = 日本時間 月曜2:00
    - cron: "0 17 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-edinet:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: EDINET財務データを更新
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python scripts/update_edinet_financials.py

      - name: 結果をコミット&push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/edinet_doc_cache.csv data/edinet_financials.csv
          git diff --staged --quiet || git commit -m "chore: weekly EDINET financial update"
          git pull --rebase
          git push
